<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>日语Bug报告的填写</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --text:#263247; --muted:#748096;
  --primary:#3d6fd8; --primary-soft:#edf3ff; --line:#dfe5ef;

*{box-sizing:border-box}

.module{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;min-height:210px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}

.toast.show{opacity:1}
.match-area{display:grid;grid-template-columns:1fr 1fr;gap:80px;position:relative;min-height:410px}
.match-col{display:flex;flex-direction:column;gap:13px;z-index:2}
.match-item{background:#f8fafc;border:2px solid #e1e6ef;border-radius:12px;padding:14px 18px;text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center;transition:.15s}
.match-item.selected{border-color:var(--primary);background:var(--primary-soft)}

.metric.warn .value{color:var(--red-text)}

.student.problem{background:#fff0f0;border-color:#f3d1d1;color:#a64b4b}
.modal{position:fixed;inset:0;background:rgba(30,40,58,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:16px;width:min(560px,92vw);padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.18);position:relative}

.answer-box{margin-top:16px;background:#f7f9fc;border-radius:11px;padding:17px;line-height:2}

.choice-list{display:flex;flex-direction:column;gap:13px;max-width:600px;margin:22px auto}
.choice{border:2px solid #e0e5ee;background:#fafbfd;border-radius:12px;padding:16px;text-align:center;font-size:17px}
.choice.selected{border-color:var(--primary);background:var(--primary-soft)}
.chart-wrap{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center}
.pie{width:260px;height:260px;border-radius:50%;margin:auto;background:conic-gradient(#3d6fd8 0 60%,#7e9fe4 60% 95%,#d8a0a0 95% 100%);position:relative}
.pie:after{content:"";position:absolute;inset:58px;background:#fff;border-radius:50%}
.chart-legend{display:flex;flex-direction:column;gap:13px}
.legend-row{display:flex;align-items:center;gap:9px}
.dot{width:13px;height:13px;border-radius:50%;display:inline-block}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin-top:18px}
@media(max-width:900px){
 .app{padding:22px 20px}
 .modules{grid-template-columns:1fr}
 .module{min-height:160px}
 .students{grid-template-columns:repeat(4,1fr)}
 .analysis-grid{grid-template-columns:1fr}
}
@media(max-width:650px){
 h1{font-size:24px}.screen-title{font-size:20px}
 .match-area{gap:18px}.students{grid-template-columns:repeat(3,1fr)}
 .chart-wrap{grid-template-columns:1fr}
 .pie{width:210px;height:210px}.pie:after{inset:47px}
}

#analysis3 .chart-legend{font-size:18px}
#analysis3 .legend-row{font-size:18px}
#analysis3 .legend-row strong{font-size:20px}
</style>
</head>

<script>
const pairs=[
  ["点击","クリックする"],["轻触","タップする"],["滑动","スワイプする"],["拖动","ドラッグする"],
  ["输入","入力する"],["启动","起動する"],["滚动","スクロールする"],["放大","拡大する"]
];
let selectedCN=null, selectedJP=null, connections=[];
let choice3Value=null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='student1') initMatch();
  if(id==='analysis2') initStudents();
  window.scrollTo(0,0);
}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1400);
}
function initMatch(){
  selectedCN=null;selectedJP=null;connections=[];
  const cn=document.getElementById('cnCol'),jp=document.getElementById('jpCol');
  cn.innerHTML='';jp.innerHTML='';
  const shuffled=[...pairs].sort(()=>Math.random()-.5);
  pairs.forEach((p,i)=>{
    const b=document.createElement('button');b.className='match-item';b.textContent=p[0];b.dataset.value=p[0];
    b.onclick=()=>selectMatch(b,'cn');cn.appendChild(b);
  });
  shuffled.forEach(p=>{
    const b=document.createElement('button');b.className='match-item';b.textContent=p[1];b.dataset.value=p[1];
    b.onclick=()=>selectMatch(b,'jp');jp.appendChild(b);
  });
  setTimeout(drawLines,50);
}
function selectMatch(btn,type){
  if(btn.classList.contains('matched'))return;
  if(type==='cn'){
    document.querySelectorAll('#cnCol .match-item').forEach(x=>x.classList.remove('selected'));
    selectedCN=btn;btn.classList.add('selected');
  }else{
    document.querySelectorAll('#jpCol .match-item').forEach(x=>x.classList.remove('selected'));
    selectedJP=btn;btn.classList.add('selected');
  }
  if(selectedCN&&selectedJP){
    connections.push([selectedCN.dataset.value,selectedJP.dataset.value,selectedCN,selectedJP]);
    selectedCN.classList.add('matched');selectedJP.classList.add('matched');
    selectedCN.classList.remove('selected');selectedJP.classList.remove('selected');
    selectedCN=null;selectedJP=null;drawLines();
  }
}
function drawLines(){
  const area=document.getElementById('matchArea'),svg=document.getElementById('matchSvg');
  if(!area||!svg)return;
  svg.innerHTML='';
  const ar=area.getBoundingClientRect();
  connections.forEach(c=>{
    const a=c[2].getBoundingClientRect(),b=c[3].getBoundingClientRect();
    const x1=a.right-ar.left,y1=a.top+a.height/2-ar.top;
    const x2=b.left-ar.left,y2=b.top+b.height/2-ar.top;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('stroke','#79b58f');line.setAttribute('stroke-width','4');line.setAttribute('stroke-linecap','round');
    svg.appendChild(line);
  });
}
window.addEventListener('resize',drawLines);
function submitMatch(){
  if(connections.length<pairs.length){toast('请完成全部配对后再提交');return;}
  toast('已提交，返回主界面');
  setTimeout(()=>showScreen('home'),500);
}
function submitText(){
  const v=document.getElementById('answer2').value.trim();
  if(!v){toast('请先输入回答');return}
  localStorage.setItem('bug_report_answer2',v);
  toast('已提交，返回主界面');
  setTimeout(()=>showScreen('home'),500);
}
function loadText(){
  const v=localStorage.getItem('bug_report_answer2');
  if(v)document.getElementById('answer2').value=v;
}
document.getElementById('student2').addEventListener('transitionend',loadText);
function choose3(btn,v){

}
function submitChoice(){
  if(!choice3Value){toast('请选择一个答案');return}
  localStorage.setItem('bug_report_choice3',choice3Value);
  toast('已提交，返回主界面');
  setTimeout(()=>showScreen('home'),500);
}
function initStudents(){
  const box=document.getElementById('students');
  if(box.children.length)return;
  const problems=new Set([3,7,12,17,19]);
  for(let i=1;i<=20;i++){
    const b=document.createElement('button');
    b.className='student'+(problems.has(i)?' problem':'');
    b.textContent='学生'+String(i).padStart(2,'0');
    b.onclick=()=>openStudent(i);
    box.appendChild(b);
  }
}
function openStudent(i){
  document.getElementById('modalTitle').textContent='学生'+String(i).padStart(2,'0')+' · 回答';
  document.getElementById('modalAnswer').innerHTML='ゲームを起動します。<br>イベントをタップします。<br>イベント画面を開きます。';
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
loadText();
</script>
</body>

  <div class="topline"><button class="back-home" onclick="showHome()">← 返回任务</button><div class="screen-title">03 📊作答分析</div></div>
  <div class="card">

    <div class="correct-list">

<script>
const words=[
  {id:"登場する",text:"登場する"},{id:"開催される",text:"開催される"},
  {id:"発売される",text:"発売される"},{id:"実装される",text:"実装される"}
];
const fills=[
  ["新イベントが","開催される"],["新商品が","発売される"],
  ["新機能がゲームに","実装される"],["新衣装が","登場する"]
];
const categories=[
  {name:"查看更多资讯",items:["詳しくはこちら！","詳細はゲーム内でご確認ください！"]},
  {name:"登陆体验游戏",items:["今すぐログイン！","ぜひプレイしてみてください！"]},
  {name:"获取/领取",items:["ぜひ手に入れてください！","ログインしてゲットしよう！"]},
  {name:"参与/提醒",items:["ぜひ参加してください！","お見逃しなく！"]}
];
let currentScreen="home", dragWord=null, dragSentence=null;

function showHome(){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.querySelector("#home").style.display="block";
  currentScreen="home";
}
function openStudent(n){
  document.querySelector("#home").style.display="none";
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.querySelector("#student"+n).classList.add("active");
  currentScreen="student"+n;
  if(n===1) renderFill();
  if(n===2) document.querySelector("#snsAnswer").value=localStorage.getItem("snsAnswer")||"";
  if(n===3) renderCategories();
}
function openAnalysis(n){
  document.querySelector("#home").style.display="none";
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.querySelector("#analysis"+n).classList.add("active");
  currentScreen="analysis"+n;
  if(n===2) renderStudents();
}
function toast(msg){
  const t=document.querySelector("#toast");t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1700);
}
function makePointerDraggable(el, startFn, endFn){
  el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture(e.pointerId);startFn(el,e);el.classList.add("dragging")});
  el.addEventListener("pointermove",e=>{if(!el.classList.contains("dragging"))return;const target=document.elementFromPoint(e.clientX,e.clientY);document.querySelectorAll(".drop-zone,.category-box").forEach(z=>z.classList.remove("over"));const zone=target&&target.closest(".drop-zone,.category-box");if(zone)zone.classList.add("over")});
  el.addEventListener("pointerup",e=>{el.classList.remove("dragging");document.querySelectorAll(".drop-zone,.category-box").forEach(z=>z.classList.remove("over"));endFn(el,e)});
  el.addEventListener("pointercancel",e=>{el.classList.remove("dragging");document.querySelectorAll(".drop-zone,.category-box").forEach(z=>z.classList.remove("over"))});
}
function renderFill(){
  document.querySelector("#wordList").innerHTML=words.map(w=>`<div class="word-chip" data-word="${w.id}">${w.text}</div>`).join("");
  document.querySelector("#fillList").innerHTML=fills.map((f,i)=>`<div class="fill-row"><div class="sentence">${f[0]}_______。</div><div class="drop-zone" data-index="${i}">拖入词语</div></div>`).join("");
  document.querySelectorAll(".word-chip").forEach(el=>makePointerDraggable(el,
    ()=>dragWord=el.dataset.word,
    (el,e)=>{
      const z=document.elementFromPoint(e.clientX,e.clientY)?.closest(".drop-zone");
      if(z){const old=z.dataset.word;if(old){document.querySelector(`.word-chip[data-word="${old}"]`)?.classList.remove("used")}
        z.dataset.word=dragWord;z.textContent=dragWord;z.classList.add("filled");
        document.querySelector(`.word-chip[data-word="${dragWord}"]`)?.classList.add("used");
      }
      dragWord=null;
    }));
}
function submit1(){
  const zones=[...document.querySelectorAll("#fillList .drop-zone")];
  if(zones.some(z=>!z.dataset.word)){toast("请先完成全部四题");return}
  let score=zones.filter((z,i)=>z.dataset.word===fills[i][1]).length;
  toast("已提交");
  setTimeout(showHome,900);
}
function submit2(){
  const val=document.querySelector("#snsAnswer").value.trim();
  if(!val){toast("请先填写社媒文案");return}
  localStorage.setItem("snsAnswer",val);toast("文案已提交");
  setTimeout(showHome,900);
}
function renderCategories(){
  const shuffled=["お見逃しなく！","今すぐログイン！","詳細はゲーム内でご確認ください！","ぜひ手に入れてください！","ぜひ参加してください！","詳しくはこちら！","ログインしてゲットしよう！","ぜひプレイしてみてください！"]; document.querySelector("#categorySentence").innerHTML=shuffled.map(s=>`<div class="category-chip" data-sentence="${encodeURIComponent(s)}">${s}</div>`).join("");
  document.querySelector("#categoryGrid").innerHTML=categories.map((c,i)=>`<div class="category-box" data-cat="${i}"><h3>${c.name}</h3><div class="category-drop"></div></div>`).join("");
  document.querySelectorAll(".category-chip").forEach(el=>makePointerDraggable(el,
    ()=>dragSentence=decodeURIComponent(el.dataset.sentence),
    (el,e)=>{
      const box=document.elementFromPoint(e.clientX,e.clientY)?.closest(".category-box");
      if(box){
        const holder=box.querySelector(".category-drop");
        const p=document.createElement("div");p.className="placed-chip";p.textContent=dragSentence;p.dataset.sentence=encodeURIComponent(dragSentence);
        holder.appendChild(p);el.classList.add("used");el.dataset.placed="1";
      }
      dragSentence=null;
    }));
}
function submit3(){
  const placed=[...document.querySelectorAll(".placed-chip")];
  if(placed.length<8){toast("请先完成全部分类");return}
  let correct=0;
  document.querySelectorAll(".category-box").forEach((box,i)=>{
    const arr=[...box.querySelectorAll(".placed-chip")].map(x=>decodeURIComponent(x.dataset.sentence));
    arr.forEach(s=>{if(categories[i].items.includes(s))correct++});
  });
  toast("已提交");setTimeout(showHome,900);
}
function renderStudents(){
  const grades=["A","A-","A","A","A-","A","A-","A","A","A-","A","A","A-","A","A","A-","A","A","A-","A"];
  document.querySelector("#students").innerHTML=grades.map((g,i)=>`<button class="student" onclick="openCompare(${i+1})"><div class="student-id">学生${String(i+1).padStart(2,"0")}</div><span class="grade ${g==="A-"?"a-minus":""}">${g}</span></button>`).join("");
}
function openCompare(id){
  const existing=document.querySelector(`.compare-modal[data-student="${id}"]`);
  if(existing) return;
  const popup=document.createElement("div");
  popup.className=`compare-modal ${id%2===1?"left":"right"}`;
  popup.dataset.student=id;
  const grade="A";
  const answer=(id===3 || id%2===1)
    ?"🌙新衣装「月影」、9月20日登場！\n期間中、ログインで無料ゲット！"
    :"🌙新衣装「月影」、9月20日登場！\n期間中、ログインで無料ゲット！\nぜひゲームでチェックしてください✨";
  popup.innerHTML=`<button class="close" onclick="this.closest('.compare-modal').remove()">×</button>
    <div class="compare-head"><span class="compare-id">学生${String(id).padStart(2,"0")}</span><span class="grade">${grade}</span></div>
    <div class="compare-answer">${answer}</div>
    <div class="ai-grade">AI评价：${grade}</div>`;
  document.querySelector("#popups").appendChild(popup);
}
function closeCompare(){document.querySelectorAll(".compare-modal").forEach(x=>x.remove())}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCompare()});
showHome();
</script>
</body>
</html>
</template>

<script>
  const loaded = { bug: false, sns: false };

  function setPage(pageId) {
    document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
    const target = document.getElementById(pageId);
    if (target) target.classList.add('active');
    window.scrollTo(0, 0);
  }

  function loadPlatform(name) {
    if (loaded[name]) return;
    const template = document.getElementById(name + '-source');
    const frame = document.getElementById(name + '-frame');
    frame.srcdoc = template.innerHTML.trim();
    loaded[name] = true;
  }

  function openPlatform(name) {
    loadPlatform(name);
    setPage(name + '-page');
  }

  function backToNavigation() {
    setPage('navigation');
  }

  window.openPlatform = openPlatform;
  window.backToNavigation = backToNavigation;
</script>
</body>
</html>
