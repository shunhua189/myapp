<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>学习平台导航</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; overflow-x: hidden; background: #f0f4f8; }
  .app-page { display: none; min-height: 100vh; }
  .app-page.active { display: block; }
  #page-nav { padding: 60px 20px; text-align: center; background: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  #page-nav h1 { color: #263247; margin-bottom: 40px; font-size: 32px; letter-spacing: 2px; }
  .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 800px; width: 100%; }
  .nav-btn { padding: 40px 20px; font-size: 24px; font-weight: bold; color: white; border: none; border-radius: 20px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
  .nav-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
  .nav-btn.bug { background: #3d6fd8; }
  .nav-btn.sns { background: #4b72d8; }
  @media (max-width: 600px) { .nav-grid { grid-template-columns: 1fr; } }

  /* 应用1：Bug报告 */
  #app-bug { --bg:#f5f7fb; --card:#fff; --text:#263247; --muted:#748096; --primary:#3d6fd8; --primary-soft:#edf3ff; --line:#dfe5ef; --green:#dff3e6; --green-text:#28734a; --red:#fde4e4; --red-text:#b44747; --shadow:0 8px 24px rgba(45,62,90,.08); background: var(--bg); color: var(--text); }
  #app-bug button { cursor: pointer; }
  #app-bug .app { padding: 28px 34px; max-width: 1100px; margin: auto; }
  #app-bug h1 { font-size: 30px; margin-bottom: 22px; }
  #app-bug .modules { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
  #app-bug .module { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; position: relative; }
  #app-bug .open-btn { margin-top: auto; border: 0; background: var(--primary); color: #fff; border-radius: 11px; padding: 12px; font-weight: 600; }
  #app-bug .analysis-btn { position: absolute; right: 18px; top: 17px; border: 0; background: #f1f4f9; color: #66738a; border-radius: 18px; padding: 6px 10px; font-size: 12px; }
  #app-bug .screen { display: none; }
  #app-bug .screen.active { display: block; }
  #app-bug .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px; margin-top: 20px; box-shadow: var(--shadow); }
  #app-bug .match-area { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; position: relative; min-height: 410px; }
  #app-bug .match-item { background: #f8fafc; border: 2px solid #e1e6ef; border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 13px; cursor: pointer; }
  #app-bug .match-item.matched { border-color: #79b58f; background: #dff3e6; color: #28734a; }
  #app-bug #matchSvg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  #app-bug .students { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }
  #app-bug .student { border: 1px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; }
  #app-bug .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 10; }
  #app-bug .modal.show { display: flex; }
  #app-bug .modal-box { background: #fff; padding: 24px; border-radius: 16px; width: min(560px, 90vw); position: relative; }

  /* 应用2：社媒文案 */
  #app-sns { --bg:#f4f7fb; --card:#fff; --text:#263247; --muted:#738097; --primary:#4b72d8; --primary-soft:#edf2ff; --line:#dfe5ef; --green:#dff3e6; --green-text:#28734a; --shadow:0 8px 24px rgba(45,62,90,.08); background: var(--bg); color: var(--text); }
  #app-sns button { cursor: pointer; }
  #app-sns .app { padding: 28px 34px; max-width: 1100px; margin: auto; }
  #app-sns .shell { display: grid; grid-template-columns: 218px 1fr; gap: 20px; }
  #app-sns .sidebar { background: #fff; border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; }
  #app-sns .nav-item { border: 0; background: transparent; text-align: left; padding: 11px 12px; border-radius: 10px; }
  #app-sns .nav-item.active { background: var(--primary-soft); color: var(--primary); }
  #app-sns .hero { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
  #app-sns .hero h1 { font-size: 30px; margin: 0; }
  #app-sns .modules { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
  #app-sns .module { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  #app-sns .open-btn { margin-top: auto; border: 0; background: var(--primary); color: #fff; border-radius: 11px; padding: 12px; }
  #app-sns .screen { display: none; }
  #app-sns .screen.active { display: block; }
  #app-sns .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px; margin-top: 20px; }
  #app-sns .word-list { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
  #app-sns .drop-zone { min-height: 54px; border: 2px dashed #ccd5e3; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: #fbfcfe; }
  #app-sns .category-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
  #app-sns .category-box { min-height: 190px; border: 2px dashed #ccd5e3; border-radius: 14px; padding: 13px; background: #fbfcfe; }
  #app-sns .category-box h3 { font-size: 15px; text-align: center; }
  #app-sns .students { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }
  #app-sns .student { border: 1px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; }
  #app-sns .compare-modal { position: fixed; top: 50%; transform: translateY(-50%); background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 20; display: none; width: min(420px, 42vw); }
  #app-sns .compare-modal.left { left: 6%; } #app-sns .compare-modal.right { right: 6%; }
  #app-sns .compare-modal.show { display: block; }
</style>
</head>
<body>

<div id="page-nav" class="app-page active">
  <h1>请选择学习任务</h1>
  <div class="nav-grid">
    <button class="nav-btn bug" onclick="switchPage('app-bug')">日语Bug报告的填写</button>
    <button class="nav-btn sns" onclick="switchPage('app-sns')">日语社媒文案撰写</button>
  </div>
</div>

<div id="app-bug" class="app-page">
  <div class="app">
    <button onclick="switchPage('page-nav')" style="margin-bottom:20px;">← 返回导航</button>
    <div id="bug-home" class="screen active">
      <div class="header"><h1>日语Bug报告的填写</h1></div>
      <div class="modules">
        <div class="module"><button class="analysis-btn" onclick="bugShowScreen('bug-analysis1')">📊 作答分析</button><div class="module-num">01</div><h2>游戏操作词汇配对</h2><p>将中文游戏操作与对应的日语表达进行配对。</p><button class="open-btn" onclick="bugShowScreen('bug-student1')">开始作答</button></div>
        <div class="module"><button class="analysis-btn" onclick="bugShowScreen('bug-analysis2')">📊 作答分析</button><div class="module-num">02</div><h2>填写「再現手順」</h2><p>将游戏 Bug 的再现步骤整理并翻译成日语。</p><button class="open-btn" onclick="bugShowScreen('bug-student2')">开始作答</button></div>
        <div class="module"><button class="analysis-btn" onclick="bugShowScreen('bug-analysis3')">📊 作答分析</button><div class="module-num">03</div><h2>接续词选择</h2><p>选择适合 Bug 报告书面表达的连接形式。</p><button class="open-btn" onclick="bugShowScreen('bug-student3')">开始作答</button></div>
      </div>
    </div>
    <div id="bug-student1" class="screen">
      <button onclick="bugShowScreen('bug-home')" style="margin-bottom:15px;">← 返回主界面</button>
      <div class="card"><div class="match-area" id="matchArea"><svg id="matchSvg"></svg><div class="match-col" id="cnCol"></div><div class="match-col" id="jpCol"></div></div></div>
    </div>
    <div id="bug-student2" class="screen">
      <button onclick="bugShowScreen('bug-home')" style="margin-bottom:15px;">← 返回主界面</button>
      <div class="card"><textarea id="bug-answer2" style="width:100%; min-height:240px;"></textarea><button onclick="bugSubmitText()" style="margin-top:15px;">提交答案</button></div>
    </div>
    <div id="bug-student3" class="screen">
      <button onclick="bugShowScreen('bug-home')" style="margin-bottom:15px;">← 返回主界面</button>
      <div class="card"><div style="text-align:center;">読み込みが完了___________、イベント画面が表示されない。</div><div style="display:flex; flex-direction:column; gap:13px; max-width:600px; margin:22px auto;"><button onclick="bugChoose3(this,'しなくて')">しなくて</button><button onclick="bugChoose3(this,'ないで')">ないで</button><button onclick="bugChoose3(this,'せず')">せず</button></div></div>
    </div>
    <div id="bug-analysis1" class="screen"><button onclick="bugShowScreen('bug-home')">← 返回</button><div class="card">词汇配对分析</div></div>
    <div id="bug-analysis2" class="screen"><button onclick="bugShowScreen('bug-home')">← 返回</button><div class="card">再現手順分析</div></div>
    <div id="bug-analysis3" class="screen"><button onclick="bugShowScreen('bug-home')">← 返回</button><div class="card">接续词分析</div></div>
  </div>
</div>

<div id="app-sns" class="app-page">
  <div class="app"><div class="shell"><aside class="sidebar"><button class="nav-item active" onclick="snsShowHome()">教学任务</button></aside><main class="main">
    <button onclick="switchPage('page-nav')" style="margin-bottom:20px;">← 返回导航</button>
    <div id="sns-home" class="screen active">
      <div class="hero"><h1>游戏的日语社媒文案撰写</h1></div>
      <div class="modules">
        <div class="module"><button class="open-btn" onclick="snsOpenStudent(1)">开始作答</button></div>
        <div class="module"><button class="open-btn" onclick="snsOpenStudent(2)">开始作答</button></div>
        <div class="module"><button class="open-btn" onclick="snsOpenStudent(3)">开始作答</button></div>
      </div>
    </div>
    <div id="sns-student1" class="screen"><button onclick="snsShowHome()">← 返回任务</button><div class="card"><div class="word-list" id="sns-wordList"></div><div id="sns-fillList" style="margin-top:20px;"></div></div></div>
    <div id="sns-student2" class="screen"><button onclick="snsShowHome()">← 返回任务</button><div class="card"><textarea id="sns-answer2" style="width:100%; min-height:210px;"></textarea><button onclick="snsSubmit2()">提交文案</button></div></div>
    <div id="sns-student3" class="screen"><button onclick="snsShowHome()">← 返回任务</button><div class="card"><div class="category-grid" id="sns-categoryGrid"></div></div></div>
    <div id="sns-analysis1" class="screen"><button onclick="snsShowHome()">← 返回</button><div class="card">分析1</div></div>
    <div id="sns-analysis2" class="screen"><button onclick="snsShowHome()">← 返回</button><div class="card">分析2</div></div>
    <div id="sns-analysis3" class="screen"><button onclick="snsShowHome()">← 返回</button><div class="card">分析3</div></div>
  </main></div></div>
</div>

<script>
  // ==================== 核心切换逻辑 ====================
  // 暴露到全局，以便 HTML 中的 onclick 能够调用
  window.switchPage = function(pageId) {
    document.querySelectorAll('.app-page').forEach(page => page.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0, 0);
  };

  // ==================== 应用1：Bug报告 ====================
  (function() {
    let choice3Value = null;
    if(!document.getElementById('bug-home')) return;
    window.bugShowScreen = function(id){ document.querySelectorAll('#app-bug .screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); };
    window.bugSubmitText = function(){ const v=document.getElementById('bug-answer2').value.trim(); if(!v) return alert('请先输入回答'); alert('已提交'); window.bugShowScreen('bug-home'); };
    window.bugChoose3 = function(btn,v){ document.querySelectorAll('#app-bug .choice').forEach(x=>x.classList.remove('selected')); btn.classList.add('selected'); choice3Value=v; };
  })();

  // ==================== 应用2：社媒文案 ====================
  (function() {
    if(!document.getElementById('sns-home')) return;
    window.snsShowHome = function(){ document.querySelectorAll('#app-sns .screen').forEach(x=>x.classList.remove('active')); document.getElementById('sns-home').classList.add('active'); };
    window.snsOpenStudent = function(n){ document.querySelectorAll('#app-sns .screen').forEach(x=>x.classList.remove('active')); document.getElementById('sns-student'+n).classList.add('active'); };
    window.snsSubmit2 = function(){ alert('文案已提交'); window.snsShowHome(); };
  })();
</script>
</body>
</html>
